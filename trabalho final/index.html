<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Gerenciador de Músicas</title>

    <link rel="stylesheet" href="estilo.css">

</head>

<body>

    <div class="topo">

        <img src="123.png" class="logo">

        <h2>Gerenciador de Músicas</h2>

    </div>


    <div class="principal">


        <div class="cadastro">

            <h2>＋ Cadastrar Música</h2>

            <p>
                Preencha os dados da música para adicioná-la à sua lista.
            </p>

            <button id="cadastrar">
                ＋ Cadastrar
            </button>

        </div>


        <div class="acoes">

            <h2>⚙ Ações</h2>

            <button id="listar">
                ☷ Listar
            </button>

            <button id="buscar">
                ⌕ Buscar
            </button>

            <button id="deletar">
                🗑 Deletar por ID
            </button>

            <button id="remover">
                🗑 Remover último
            </button>

            <button id="limpar">
                ✕ Limpar tudo
            </button>

        </div>


        <div class="busca">

            <h2>⌕ Buscar música</h2>

            <p>
                Clique no botão para procurar uma música.
            </p>

            <button id="botaoBuscar">
                🔍 Buscar
            </button>

        </div>


    

        <div class="lista">

            <h2>♫ Músicas cadastradas</h2>

            <p>
                Total de músicas:
                <span id="total">0</span>
            </p>


            <table id="tabela">

                <tr>

                    <th>ID</th>

                    <th>Música</th>

                    <th>Artista</th>

                    <th>Gênero</th>

                    <th>Ano</th>

                    <th>Ações</th>

                </tr>

            </table>

        </div>

</div>


</body>

</html>
